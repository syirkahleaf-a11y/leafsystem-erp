<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeafSystem ERP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#f4f6f9;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#111827;
    color:white;
    padding:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    background:#1f2937;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.menu button:hover{
    background:#374151;
}

.main{
    flex:1;
    padding:20px;
}

.header{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:24px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card h3{
    margin-bottom:10px;
    color:#374151;
}

.card p{
    font-size:24px;
    font-weight:bold;
    color:#111827;
}
</style>

</head>

<body>

<div class="sidebar">
    <div class="logo">LeafSystem ERP</div>

    <div class="menu">
        <button>Dashboard</button>
        <button>Stock Tembakau</button>
        <button>Pembelian</button>
        <button>Produksi</button>
        <button>Kas Operasional</button>
        <button>Laporan</button>
    </div>
</div>

<div class="main">

    <div class="header">
        Dashboard ERP Tembakau
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Stock</h3>
            <p>25.000 KG</p>
        </div>

        <div class="card">
            <h3>Pembelian Hari Ini</h3>
            <p>5.200 KG</p>
        </div>

        <div class="card">
            <h3>Batch Produksi</h3>
            <p>3 Batch</p>
        </div>

        <div class="card">
            <h3>Kas Operasional</h3>
            <p>Rp 85 JT</p>
        </div>

    </div>

</div>

</body>
</html>
