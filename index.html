<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafSystem ERP</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:250px;
      background:#111827;
      padding:20px;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
      margin-bottom:30px;
      color:#22c55e;
    }

    .menu button{
      width:100%;
      padding:15px;
      margin-bottom:10px;
      border:none;
      border-radius:10px;
      background:#1f2937;
      color:white;
      cursor:pointer;
      text-align:left;
      font-size:16px;
    }

    .menu button:hover{
      background:#22c55e;
    }

    .main{
      flex:1;
      padding:30px;
    }

    .header{
      font-size:30px;
      margin-bottom:30px;
      font-weight:bold;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    .card h3{
      margin-bottom:15px;
      color:#22c55e;
    }

    .card p{
      font-size:24px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="logo">LeafSystem ERP</div>

    <div class="menu">
      <button>Dashboard</button>
      <button>Stock Tembakau</button>
      <button>Pembelian</button>
      <button>Produksi</button>
      <button>Kas Operasional</button>
      <button>Laporan</button>
    </div>
  </div>

  <div class="main">

    <div class="header">
      Dashboard ERP Tembakau
    </div>

    <div class="cards">

      <div class="card">
        <h3>Total Stock</h3>
        <p>25.000 KG</p>
      </div>

      <div class="card">
        <h3>Pembelian Hari Ini</h3>
        <p>5.200 KG</p>
      </div>

      <div class="card">
        <h3>Batch Produksi</h3>
        <p>3 Batch</p>
      </div>

      <div class="card">
        <h3>Kas Operasional</h3>
        <p>Rp 85 JT</p>
      </div>

    </div>

  </div>

</body>
</html>
